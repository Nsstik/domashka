<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Домашка</title>
<meta name="description" content="Домашние задания по дисциплинам: важное горит красным, сделанное зачёркивается. Каждый ведёт свой список.">
<meta property="og:title" content="Домашка">
<meta property="og:description" content="Домашние задания по дисциплинам. Каждый ведёт свой список, чужие задания никто не видит.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F4F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Домашка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F4F7FA; --grid:#E0E8F0; --sheet:#FFFFFF; --paper-2:#F7F9FC;
  --line:#DAE2EB; --line-soft:#EDF1F5;
  --text:#23272E; --muted:#667080; --pencil:#9AA2AD;
  --ink:#1E4DBA; --on-ink:#FFFFFF; --ink-soft:rgba(30,77,186,.08); --ink-glow:rgba(30,77,186,.32);
  --red:#D1263A; --on-red:#FFFFFF; --red-soft:rgba(209,38,58,.075); --red-glow:rgba(209,38,58,.38);
  --margin:#F1B5BD; --hover:rgba(30,45,70,.045);
  --shadow:rgba(20,30,50,.16); --scrim:rgba(18,24,34,.42);
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --ui:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151B; --grid:#1A2029; --sheet:#171D25; --paper-2:#11161D;
    --line:#29313C; --line-soft:#1F262F;
    --text:#E5E8ED; --muted:#9BA4B0; --pencil:#69727E;
    --ink:#86A8FF; --on-ink:#0D1424; --ink-soft:rgba(134,168,255,.11); --ink-glow:rgba(134,168,255,.35);
    --red:#FF6F7F; --on-red:#1C0A0D; --red-soft:rgba(255,111,127,.11); --red-glow:rgba(255,111,127,.4);
    --margin:#5B2C35; --hover:rgba(255,255,255,.045);
    --shadow:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#11151B; --grid:#1A2029; --sheet:#171D25; --paper-2:#11161D;
  --line:#29313C; --line-soft:#1F262F;
  --text:#E5E8ED; --muted:#9BA4B0; --pencil:#69727E;
  --ink:#86A8FF; --on-ink:#0D1424; --ink-soft:rgba(134,168,255,.11); --ink-glow:rgba(134,168,255,.35);
  --red:#FF6F7F; --on-red:#1C0A0D; --red-soft:rgba(255,111,127,.11); --red-glow:rgba(255,111,127,.4);
  --margin:#5B2C35; --hover:rgba(255,255,255,.045);
  --shadow:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{
  margin:0;color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:28px 20px 40px}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:20px 32px;align-items:end}
h1{font-family:var(--hand);font-weight:700;font-size:clamp(52px,9vw,76px);line-height:.85;color:var(--ink);margin:0;letter-spacing:.5px}
.summary{margin:12px 0 0;color:var(--muted);max-width:60ch}
.summary b{color:var(--text);font-weight:600}
.summary .hot{color:var(--red)}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tally{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:14px 16px 12px}
.tally-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tally-label{font-size:14px;color:var(--muted)}
.tally-num{font-family:var(--hand);font-weight:700;font-size:38px;line-height:1;color:var(--ink)}
.sticks{display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:6px;min-height:30px;align-items:center}
.sticks svg{width:34px;height:30px;flex:none;fill:none;stroke:var(--ink);stroke-width:2.3;stroke-linecap:round}
.sticks .new{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tally-empty{margin:0;font-size:13.5px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;padding:8px 14px;min-height:38px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:var(--text);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--pencil)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn-primary:hover{border-color:var(--ink);filter:brightness(1.07)}
.btn-danger{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn-danger:hover{border-color:var(--red);filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--hover);border-color:transparent}
.btn-ghost.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{min-height:32px;padding:4px 10px;font-size:13px}
.icon-btn{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;padding:0}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:20px;align-items:start;margin-top:30px}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding-bottom:4px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:1.5px;background:var(--margin);pointer-events:none}
.sheet.personal::before{background:var(--line)}
.sheet-head{position:relative;display:flex;align-items:flex-start;gap:6px;padding:12px 8px 10px 56px;border-bottom:1px solid var(--line)}
.sheet-head-main{flex:1;min-width:0}
.sheet-title{font-family:var(--hand);font-weight:700;font-size:31px;line-height:1.02;color:var(--ink);margin:0;overflow-wrap:anywhere}
.personal .sheet-title{color:var(--muted)}
.sheet-meta{font-size:13px;color:var(--muted);margin-top:3px}
.sheet-meta .hot{color:var(--red);font-weight:600}
.rename{display:flex;gap:6px;align-items:center}
.rename input{flex:1;min-width:0;font-family:var(--hand);font-weight:700;font-size:26px;color:var(--ink);border:1px solid var(--line);border-radius:6px;background:var(--paper-2);padding:2px 8px}
.menu{position:absolute;right:8px;top:48px;z-index:20;min-width:210px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px var(--shadow);padding:4px}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;font-size:14px;border-radius:4px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu .danger{color:var(--red)}

/* tasks */
.tasks{list-style:none;margin:0;padding:0}
.task{position:relative;border-bottom:1px solid var(--line-soft)}
.task-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:start;padding:9px 10px 9px 0;transition:background-color .2s}
.task:not(.high):not(.low) .task-row:hover,.task.editing .task-row{background:var(--hover)}
.check{position:relative;justify-self:center;margin-top:1px;width:22px;height:22px;border-radius:50%;border:2px solid var(--pencil);background:transparent;color:transparent;display:grid;place-items:center;padding:0;cursor:pointer;transition:border-color .15s,background-color .15s}
.check::after{content:"";position:absolute;inset:-10px}
.check:hover{border-color:var(--ink);color:var(--ink)}
.task-body{padding-left:12px;min-width:0;cursor:pointer;border-radius:3px}
.task-body:focus-visible{outline-offset:-2px}
.task-text{white-space:pre-wrap;overflow-wrap:anywhere;background-image:linear-gradient(var(--ink),var(--ink));background-repeat:no-repeat;background-position:0 58%;background-size:0 2px;transition:background-size .42s cubic-bezier(.3,.7,.4,1)}
.task.striking .task-text{background-size:100% 2px}
.task.striking .check{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.task-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;color:var(--muted);margin-top:3px}
.task-meta > span{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.due.urgent{color:var(--red);font-weight:600}
.note-prev > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-prev svg,.due svg{flex:none}

.prio{margin-top:0;font-size:12px;font-weight:600;line-height:1.2;border-radius:999px;padding:4px 10px;border:1px dashed var(--line);background:transparent;color:var(--pencil);cursor:pointer;white-space:nowrap;transition:opacity .15s}
.prio.high{background:var(--red);border:1px solid var(--red);color:var(--on-red);box-shadow:0 0 0 3px var(--red-soft),0 0 14px var(--red-glow)}
.prio.low{background:var(--ink);border:1px solid var(--ink);color:var(--on-ink);box-shadow:0 0 0 3px var(--ink-soft),0 0 14px var(--ink-glow)}
@media (hover:hover){
  .prio.none{opacity:0}
  .task:hover .prio.none,.prio.none:focus-visible{opacity:1}
}
.task.high .task-row{background:var(--red-soft)}
.task.low .task-row{background:var(--ink-soft)}
.task.high::before,.task.low::before{content:"";position:absolute;left:42px;top:0;bottom:0;width:4px;border-radius:2px;z-index:1}
.task.high::before{background:var(--red);box-shadow:0 0 10px var(--red-glow)}
.task.low::before{background:var(--ink);box-shadow:0 0 10px var(--ink-glow)}
.task.high .check{border-color:var(--red)}
.task.low .check{border-color:var(--ink)}

.task.done .task-text{background-size:100% 2px;color:var(--muted)}
.task.done .check{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.done-list .task{border-bottom-color:transparent}
.done-list .task-row{padding-top:6px;padding-bottom:6px}

.add{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;padding-right:8px}
.add .plus{justify-self:center;color:var(--pencil);display:grid}
.add input{font:inherit;font-size:16px;border:0;background:transparent;color:var(--text);padding:10px 12px;width:100%;min-width:0;border-radius:4px}
.add input::placeholder{color:var(--pencil)}
.add input:focus{outline:none;background:var(--hover)}
.add input:focus-visible{box-shadow:inset 0 -2px 0 var(--ink)}
.add input:placeholder-shown + .btn{display:none}

.done-toggle{display:grid;grid-template-columns:44px auto;align-items:center;width:100%;padding:8px 0;border:0;border-top:1px solid var(--line-soft);background:none;font-size:13.5px;color:var(--muted);cursor:pointer;text-align:left}
.done-toggle:hover{color:var(--text)}
.done-toggle .chev{justify-self:center;display:grid;transition:transform .2s}
.done-toggle .chev.open{transform:rotate(90deg)}
.done-toggle span:last-child{padding-left:12px}

/* editor */
.editor{display:grid;gap:12px;padding:6px 14px 16px 56px;background:var(--hover)}
.fld{display:grid;gap:5px;min-width:0}
.fld > span,.fld > label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld textarea,.fld input,.fld select{font:inherit;font-size:16px;color:var(--text);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{resize:vertical;line-height:1.4}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.date-wrap{display:flex;gap:4px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-btn{font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;background:transparent;cursor:pointer;min-height:34px}
.seg-btn.high{border:1.5px solid var(--red);color:var(--red)}
.seg-btn.low{border:1.5px solid var(--ink);color:var(--ink)}
.seg-btn.high.on{background:var(--red);color:var(--on-red);box-shadow:0 0 12px var(--red-glow)}
.seg-btn.low.on{background:var(--ink);color:var(--on-ink);box-shadow:0 0 12px var(--ink-glow)}
.editor-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:2px}

/* add discipline */
.ghost{min-height:100px;border:1.5px dashed var(--pencil);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-family:var(--hand);font-weight:700;font-size:28px;padding:16px}
.ghost:hover{background:var(--sheet);border-color:var(--ink)}
.new-sheet{padding:14px 14px 14px 56px}
.new-sheet .new-title{font-family:var(--hand);font-weight:700;font-size:30px;line-height:1;color:var(--ink);margin:0 0 6px}
.new-sheet p{margin:0 0 12px;color:var(--muted);font-size:14px}
.new-sheet input{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);color:var(--text);padding:9px 11px}
.new-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

/* footer, banner */
.foot{margin-top:36px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted);font-size:13.5px}
.foot p{margin:0;max-width:70ch}
.banner{background:var(--red-soft);border:1px solid var(--red);color:var(--text);border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:14px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.modal{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 50px var(--shadow);padding:22px 22px 18px}
.modal h2{font-family:var(--hand);font-weight:700;font-size:40px;line-height:1;color:var(--ink);margin:0 0 6px}
.modal h3{font-size:16px;margin:22px 0 4px}
.modal p{margin:0 0 12px}
.muted{color:var(--muted)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.confirm-title{font-size:18px;font-weight:600;margin:0 0 8px}
.stat-big{display:flex;align-items:baseline;gap:10px;margin:14px 0 16px !important}
.stat-big b{font-family:var(--hand);font-size:64px;line-height:.8;color:var(--ink)}
.bars{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.bars .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.past{list-style:none;margin:0;padding:0}
.past li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.end-sem{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.end-sem p{font-size:14px;color:var(--muted)}
.code{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);color:var(--text);padding:8px 10px;resize:vertical}
.bk-actions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);background:var(--text);color:var(--sheet);padding:10px 12px 10px 16px;border-radius:8px;box-shadow:0 10px 30px var(--shadow);font-size:14px}
.toast button{border:0;background:transparent;color:var(--sheet);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px;white-space:nowrap}

@media (max-width:760px){
  .wrap{padding:20px 14px 32px}
  .top{grid-template-columns:minmax(0,1fr)}
  .board{margin-top:24px;gap:16px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
  .sticks .new{stroke-dashoffset:0}
}

/* sync & auth */
.sync-btn .dot,.acct-status .dot{width:8px;height:8px;border-radius:50%;background:var(--pencil);flex:none}
.sync-btn.synced .dot,.acct-status.synced .dot{background:var(--ink)}
.sync-btn.syncing .dot,.sync-btn.loading .dot,.acct-status.syncing .dot{background:var(--ink);animation:pulse 1.1s ease-in-out infinite}
.sync-btn.error,.acct-status.error{color:var(--red)}
.sync-btn.error{border-color:var(--red)}
.sync-btn.error .dot,.acct-status.error .dot{background:var(--red)}
.sync-btn.signed-out{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.sync-btn.signed-out .dot{display:none}
@keyframes pulse{50%{opacity:.25}}
.acct-status{display:flex;align-items:center;gap:8px;margin:0 0 12px !important;font-size:14px}
.auth-form{display:grid;gap:12px;margin-top:4px}
.show-pw{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;justify-self:start}
.show-pw input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.form-msg{margin:0 !important;color:var(--red);font-size:14px}
.form-msg.ok{color:var(--ink)}
.btn.wide{width:100%;min-height:44px}
.link{border:0;background:none;padding:2px 0;color:var(--ink);font-size:inherit;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.auth-alt{margin-top:16px;font-size:14px;color:var(--muted);display:grid;gap:8px;justify-items:start}
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>
  <header class="top">
    <div>
      <h1>Домашка</h1>
      <p id="summary" class="summary"></p>
      <div class="head-actions">
        <button id="sync-btn" class="btn sync-btn" data-action="open-account" hidden></button>
        <button class="btn" data-action="open-stats">Итоги семестра</button>
        <button class="btn" data-action="open-backup">Резервная копия</button>
      </div>
    </div>
    <section class="tally" aria-labelledby="tally-label">
      <div class="tally-head">
        <span id="tally-label" class="tally-label">Сделано в этом семестре</span>
        <span id="tally-num" class="tally-num">0</span>
      </div>
      <div id="sticks" class="sticks"></div>
    </section>
  </header>
  <main id="board" class="board"></main>
  <footer class="foot"><p id="foot-text"></p></footer>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
var LOCAL_KEY='domashka.v1', PERSONAL='personal', TOMB_TTL=120*86400000, FB_VER='12.18.0';
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var MON_FULL=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

  check:'<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.2 8.4l3 3 6.6-6.8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',

function plural(n,a,b,c){n=Math.abs(n)%100;var n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}

function defaultState(){return {v:2,subjects:[],tasks:[],semesters:[],semesterStart:now(),metaAt:0,deleted:{tasks:{},subjects:{}}}}
function validId(x){return x&&x.id!=null&&String(x.id).length<80}
function normalize(s){
  var d=defaultState();
  if(!s||typeof s!=='object')return d;
  var t0=now(),del={tasks:{},subjects:{}};
  if(s.deleted&&typeof s.deleted==='object'){
    ['tasks','subjects'].forEach(function(k){
      var src=s.deleted[k];
      if(src&&typeof src==='object')Object.keys(src).sort().forEach(function(id){var ts=+src[id];if(ts&&t0-ts<TOMB_TTL)del[k][id]=ts});
    });
  }
  var subjects=Array.isArray(s.subjects)?s.subjects.filter(function(x){return validId(x)&&typeof x.name==='string'&&String(x.id)!==PERSONAL}).map(function(x,i){
    return {id:String(x.id),name:x.name.slice(0,80),pos:(typeof x.pos==='number'&&isFinite(x.pos))?x.pos:i,updatedAt:+x.updatedAt||0};
  }):[];
  subjects.sort(function(a,b){return (a.pos-b.pos)||(a.id<b.id?-1:a.id>b.id?1:0)});
  var ids={};subjects.forEach(function(x){ids[x.id]=1});ids[PERSONAL]=1;
  var tasks=Array.isArray(s.tasks)?s.tasks.filter(function(t){return validId(t)&&typeof t.text==='string'}).map(function(t){
    var done=!!t.done;
    return {id:String(t.id),subjectId:ids[t.subjectId]?String(t.subjectId):PERSONAL,text:t.text.slice(0,500),
      note:typeof t.note==='string'?t.note:'',due:/^\d{4}-\d{2}-\d{2}$/.test(t.due||'')?t.due:'',
      priority:(t.priority==='high'||t.priority==='low')?t.priority:'',done:done,doneAt:done?(+t.doneAt||now()):null,
      createdAt:+t.createdAt||now(),updatedAt:+t.updatedAt||0};
  }):[];
  tasks.sort(function(a,b){return a.id<b.id?-1:a.id>b.id?1:0});
  var semesters=Array.isArray(s.semesters)?s.semesters.filter(function(x){return x&&typeof x.total==='number'}).map(function(x){
    return {id:String(x.id||('s'+(+x.end||0)+'_'+x.total)),label:String(x.label||'Семестр'),start:+x.start||0,end:+x.end||0,total:x.total,
      bySubject:Array.isArray(x.bySubject)?x.bySubject.filter(function(b){return b&&typeof b.name==='string'}).map(function(b){return {name:b.name,n:+b.n||0}}):[]};
  }):[];
  semesters.sort(function(a,b){return (b.end-a.end)||(a.id<b.id?-1:a.id>b.id?1:0)});
  return {v:2,subjects:subjects,tasks:tasks,semesters:semesters,semesterStart:+s.semesterStart||d.semesterStart,metaAt:+s.metaAt||0,deleted:del};
}
function mergeStates(a,b){
  var del={tasks:{},subjects:{}};
  ['tasks','subjects'].forEach(function(k){
    [a.deleted[k],b.deleted[k]].forEach(function(src){Object.keys(src).forEach(function(id){if(!(del[k][id]>=src[id]))del[k][id]=src[id]})});
  });
  function pick(la,lb,tomb){
    var m={};
    la.concat(lb).forEach(function(x){
      var c=m[x.id];
      if(!c||x.updatedAt>c.updatedAt||(x.updatedAt===c.updatedAt&&JSON.stringify(x)>JSON.stringify(c)))m[x.id]=x;
    });
    var out=[];
    Object.keys(m).forEach(function(id){
      var x=m[id];
      if(tomb[id]!=null&&tomb[id]>=x.updatedAt)return;
      if(tomb[id]!=null)delete tomb[id];
      out.push(x);
    });
    return out;
  }
  var subjects=pick(a.subjects,b.subjects,del.subjects),tasks=pick(a.tasks,b.tasks,del.tasks);
  var sem={};a.semesters.concat(b.semesters).forEach(function(x){sem[x.id]=x});
  var meta=a.metaAt>b.metaAt?a:b.metaAt>a.metaAt?b:(a.semesterStart<=b.semesterStart?a:b);
  return normalize({subjects:subjects,tasks:tasks,semesters:Object.keys(sem).map(function(k){return sem[k]}),
    semesterStart:meta.semesterStart,metaAt:meta.metaAt,deleted:del});
}

function load(key){
  var raw=lsGet(key);
  if(!raw)return defaultState();
  try{return normalize(JSON.parse(raw))}catch(e){return defaultState()}
}

function sortActive(arr){return arr.slice().sort(function(a,b){
  return (PR[a.priority]-PR[b.priority])||(a.due||'9999').localeCompare(b.due||'9999')||(a.createdAt-b.createdAt)})}
function dueInfo(s){
  var p=s.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]),today=new Date();today.setHours(0,0,0,0);
  var diff=Math.round((dt-today)/86400000),rel='';
  if(diff<0)rel='просрочено';else if(diff===0)rel='сегодня';else if(diff===1)rel='завтра';
  else if(diff<7)rel='через '+diff+' '+plural(diff,'день','дня','дней');
  return {diff:diff,label:'до '+WD[dt.getDay()]+', '+p[2]+' '+MON[p[1]-1],rel:rel,urgent:diff<=1};
}
function fmtShort(ts){var d=new Date(ts);return d.getDate()+' '+MON[d.getMonth()]}
function fmtLong(ts){var d=new Date(ts);return d.getDate()+' '+MON_FULL[d.getMonth()]+' '+d.getFullYear()}
function semLabel(ts){var d=new Date(ts),m=d.getMonth();if(m>=7)return 'Осень '+d.getFullYear();if(m===0)return 'Осень '+(d.getFullYear()-1);return 'Весна '+d.getFullYear()}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ---------- tally ---------- */
function groupSVG(n,g,newIdx){
  var p='';
  for(var k=0;k<Math.min(n,4);k++){
    var idx=g*5+k,j=(rnd(idx)-.5)*2.2,j2=(rnd(idx+.5)-.5)*3,x=7+k*6.4+j;
    p+='<path pathLength="1" class="'+(idx===newIdx?'new':'')+'" d="M'+x.toFixed(1)+' '+(3.5+rnd(idx+1)*2).toFixed(1)+' L'+(x+j2).toFixed(1)+' '+(25+rnd(idx+2)*2).toFixed(1)+'"/>';
  }
  if(n===5){var i5=g*5+4;
    p+='<path pathLength="1" class="'+(i5===newIdx?'new':'')+'" d="M2.5 '+(19+rnd(i5)*3).toFixed(1)+' L'+(31+rnd(i5+1)*1.5).toFixed(1)+' '+(8+rnd(i5+2)*3).toFixed(1)+'"/>';}
  return '<svg viewBox="0 0 34 30" aria-hidden="true">'+p+'</svg>';
}
function tallyHTML(count,animate){
  if(!count)return '<p class="tally-empty">Отмечай сделанные задания, и за каждое здесь появится палочка.</p>';
  var newIdx=animate?count-1:-1,out='',full=Math.floor(count/5),rem=count%5;
  for(var g=0;g<full;g++)out+=groupSVG(5,g,newIdx);
  if(rem)out+=groupSVG(rem,full,newIdx);
  return out;
}

var CFG=window.DOMASHKA_FIREBASE||(typeof firebaseConfig!=='undefined'?firebaseConfig:null); // eslint-disable-line no-undef
if(!CFG||!CFG.apiKey||!CFG.projectId)CFG=null;
var cloud={enabled:!!CFG,api:null,user:null,status:CFG?'loading':'off',err:'',unsub:null,pushTimer:null,retryTimer:null,
  pushing:false,dirty:false,waitingFirst:false,pendingGuest:null,loadFailed:false};
var STATUS_TEXT={loading:'Подключаю облако…','signed-out':'Войти для синхронизации',syncing:'Синхронизация…',
  synced:'Синхронизировано',offline:'Нет сети, сохранено на устройстве',error:'Ошибка синхронизации'};
function renderSync(){
  var b=$('#sync-btn');if(!b)return;
  b.hidden=!cloud.enabled;

  b.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+esc(STATUS_TEXT[cloud.status]||'')+'</span>';
  var st=$('#acct-status');
  if(st)st.innerHTML='<span class="dot" aria-hidden="true"></span><span>'+esc(STATUS_TEXT[cloud.status]||'')+(cloud.status==='error'&&cloud.err?'. '+esc(cloud.err):'')+'</span>';
  if(st)st.className='acct-status '+cloud.status;
}
function setStatus(s,err){cloud.status=s;cloud.err=err||'';renderSync()}
function parseRemote(data){
  if(!data||typeof data.data!=='string')return null;
  try{return normalize(JSON.parse(data.data))}catch(e){return null}
}
function loadFirebase(){
  var base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  var imp=new Function('u','return import(u)');
  return Promise.all([imp(base+'firebase-app.js'),imp(base+'firebase-auth.js'),imp(base+'firebase-firestore.js')]).then(function(m){
    var appM=m[0],authM=m[1],fsM=m[2];
    var app=appM.initializeApp(CFG),auth=authM.getAuth(app),db=fsM.getFirestore(app);
    try{auth.languageCode='ru'}catch(e){}
    return {
      onAuth:function(cb){return authM.onAuthStateChanged(auth,cb)},
      signIn:function(e,p){return authM.signInWithEmailAndPassword(auth,e,p)},
      signUp:function(e,p){return authM.createUserWithEmailAndPassword(auth,e,p)},
      signOut:function(){return authM.signOut(auth)},
      reset:function(e){return authM.sendPasswordResetEmail(auth,e)},
      watch:function(id,next,fail){
        return fsM.onSnapshot(fsM.doc(db,'users',id),{includeMetadataChanges:false},function(snap){
          next(snap.exists()?snap.data():null,snap.metadata.fromCache);
        },fail);
      },
      push:function(id,mergeFn){
        var ref=fsM.doc(db,'users',id);
        return fsM.runTransaction(db,function(tx){
          return tx.get(ref).then(function(snap){
            var out=mergeFn(snap.exists()?snap.data():null);
            if(out.write)tx.set(ref,{data:out.data,v:2,updatedAt:fsM.serverTimestamp()});
            return out;
          });
        });
      }
    };
  });
}
function initCloud(){
  if(!cloud.enabled){renderSync();return}
  setStatus('loading');
  var p=window.__DOMASHKA_TEST_FB?Promise.resolve(window.__DOMASHKA_TEST_FB):loadFirebase();
  p.then(function(api){
    cloud.api=api;cloud.loadFailed=false;
    api.onAuth(function(user){if(user)onSignedIn(user);else onSignedOut()});
  },function(){
    cloud.loadFailed=true;
    setStatus(navigator.onLine===false?'offline':'error','Не удалось подключиться к облаку');
  });
}
function onSignedIn(user){
  if(cloud.user&&cloud.user.uid===user.uid)return;
  if(cloud.user)onSignedOut();
  var guest=currentKey===LOCAL_KEY?state:load(LOCAL_KEY);
  cloud.user={uid:user.uid,email:user.email||''};
  currentKey='domashka.u.'+user.uid;
  state=load(currentKey);
  cloud.pendingGuest=(hasContent(guest)&&!lsGet('domashka.guestAsked.'+user.uid))?guest:null;
  cloud.waitingFirst=true;cloud.dirty=false;
  ui.editing=null;ui.menu=null;ui.renaming=null;ui.openDone={};
  setStatus('syncing');render();
  var myUid=user.uid;
  cloud.unsub=cloud.api.watch(myUid,function(data,fromCache){
    if(!cloud.user||cloud.user.uid!==myUid)return;
    if(fromCache){if(cloud.status!=='syncing'||!navigator.onLine)setStatus('offline');return}
    onRemote(data);
  },function(err){
    if(!cloud.user||cloud.user.uid!==myUid)return;
    var code=err&&err.code||'';
    setStatus('error',code==='permission-denied'?'База не пускает. Проверь правила доступа в Firebase':'Нет связи с облаком');
  });
}
function onRemote(data){
  var remote=parseRemote(data);
  var before=JSON.stringify(state);
  if(remote)state=mergeStates(state,remote);
  var after=JSON.stringify(state);
  if(after!==before){persistLocal();render()}
  if(cloud.waitingFirst){
    cloud.waitingFirst=false;
    if(after===before)renderHeader();
    if(cloud.pendingGuest)askGuestImport();
  }
  if(!remote||JSON.stringify(remote)!==after)schedulePush(0);
  else if(!cloud.dirty&&!cloud.pushing)setStatus('synced');
}
function askGuestImport(){
  var g=cloud.pendingGuest,u=cloud.user;cloud.pendingGuest=null;
  if(!g||!u)return;
  var ns=g.subjects.length,nt=g.tasks.length;
  askConfirm({title:'Добавить список с этого устройства?',
    text:'Здесь есть список без аккаунта: '+ns+' '+plural(ns,'дисциплина','дисциплины','дисциплин')+' и '+nt+' '+plural(nt,'задание','задания','заданий')+'. Если добавить, он объединится с тем, что уже есть в аккаунте.',
    ok:'Добавить',cancel:'Не добавлять'}).then(function(ok){
    lsSet('domashka.guestAsked.'+u.uid,'1');
    if(!ok||!cloud.user||cloud.user.uid!==u.uid)return;
    state=mergeStates(state,g);
    lsDel(LOCAL_KEY);
    save();render();toast('Список добавлен в аккаунт');
  });
}
function schedulePush(delay){
  if(!cloud.user||!cloud.api)return;
  cloud.dirty=true;
  clearTimeout(cloud.pushTimer);
  cloud.pushTimer=setTimeout(pushNow,delay==null?900:delay);
  if(cloud.status!=='offline'&&cloud.status!=='error')setStatus('syncing');
}
function pushNow(){
  if(!cloud.user||!cloud.api)return;
  if(cloud.pushing){cloud.dirty=true;return}
  clearTimeout(cloud.pushTimer);
  cloud.pushing=true;cloud.dirty=false;
  var myUid=cloud.user.uid;
  if(cloud.status!=='offline')setStatus('syncing');
  cloud.api.push(myUid,function(data){
    var remote=parseRemote(data);
    var merged=remote?mergeStates(state,remote):normalize(state);
    var s=JSON.stringify(merged);
    if(byteLen(s)>900000){var e=new Error('too big');e.code='too-big';throw e}
    return {write:!remote||s!==JSON.stringify(remote),data:s,merged:merged};
  }).then(function(out){
    cloud.pushing=false;
    if(!cloud.user||cloud.user.uid!==myUid)return;
    var before=JSON.stringify(state);
    state=mergeStates(state,out.merged);
    if(JSON.stringify(state)!==before){persistLocal();render()}
    if(cloud.dirty)schedulePush(300);else setStatus('synced');
  },function(err){
    cloud.pushing=false;cloud.dirty=true;
    if(!cloud.user||cloud.user.uid!==myUid)return;
    var code=err&&err.code||'';
    if(code==='too-big')setStatus('error','Список слишком большой для облака. Заверши семестр, чтобы освободить место');
    else if(code==='permission-denied')setStatus('error','База не пускает. Проверь правила доступа в Firebase');
    else if(navigator.onLine===false||code==='unavailable'||code==='deadline-exceeded')setStatus('offline');
    else setStatus('error','Попробую ещё раз через несколько секунд');
    clearTimeout(cloud.retryTimer);
    cloud.retryTimer=setTimeout(function(){if(cloud.dirty)pushNow()},15000);
  });
}
function onSignedOut(){
  if(!cloud.user){if(cloud.enabled&&cloud.api)setStatus('signed-out');return}
  var u=cloud.user;
  if(cloud.unsub){try{cloud.unsub()}catch(e){}}
  cloud.unsub=null;cloud.user=null;cloud.dirty=false;cloud.pushing=false;cloud.waitingFirst=false;cloud.pendingGuest=null;
  clearTimeout(cloud.pushTimer);clearTimeout(cloud.retryTimer);
  lsDel('domashka.u.'+u.uid);
  currentKey=LOCAL_KEY;state=load(LOCAL_KEY);
  ui.editing=null;ui.menu=null;ui.renaming=null;ui.openDone={};
  setStatus('signed-out');render();
}

  openModal('<h2>Аккаунт</h2><p>Вход выполнен: <b>'+esc(cloud.user.email)+'</b></p>'+
    '<p id="acct-status" class="acct-status"></p>'+
    '<p class="muted">Список синхронизируется между всеми устройствами, где выполнен вход в этот аккаунт. Изменения без интернета сохраняются на устройстве и отправятся, когда связь появится.</p>'+
    '<div class="bk-actions"><button class="btn" data-action="sync-now">Синхронизировать сейчас</button><button class="btn btn-ghost danger" data-action="sign-out">Выйти из аккаунта</button></div>'+
    '<div class="modal-foot"><button class="btn btn-primary" data-action="close-modal" data-autofocus>Закрыть</button></div>','account');
  renderSync();
}
function authMsg(text,ok){
  var m=overlay.querySelector('.form-msg');if(!m)return;
  m.textContent=text;m.hidden=!text;m.className='form-msg'+(ok?' ok':'');
}
function submitAuth(f){
  if(!cloud.api){authMsg('Облако ещё не подключилось. Проверь интернет и попробуй снова.');return}
  var email=f.querySelector('[name=email]').value.trim(),pw=f.querySelector('[name=password]').value,mode=f.dataset.mode;
  authEmail=email;
  if(!email){authMsg('Впиши адрес почты.');return}
  if(!pw){authMsg('Впиши пароль.');return}
  if(mode==='up'&&pw.length<6){authMsg('Пароль должен быть не короче 6 символов.');return}
  var btn=f.querySelector('button[type=submit]'),label=btn.textContent;
  btn.disabled=true;btn.textContent=mode==='up'?'Создаю аккаунт…':'Вхожу…';authMsg('');
  (mode==='up'?cloud.api.signUp(email,pw):cloud.api.signIn(email,pw)).then(function(){
    if(modalKind==='auth')closeModal();
    toast(mode==='up'?'Аккаунт создан, список синхронизируется':'Вход выполнен');
  },function(err){
    btn.disabled=false;btn.textContent=label;authMsg(authErrText(err));
  });
}
function sendReset(){
  var inp=overlay.querySelector('[name=email]'),email=inp?inp.value.trim():'';
  if(!email){authMsg('Впиши почту выше, и на неё придёт ссылка для нового пароля.');if(inp)inp.focus();return}
  if(!cloud.api){authMsg('Облако ещё не подключилось. Проверь интернет.');return}
  authEmail=email;
  cloud.api.reset(email).then(function(){
    authMsg('Если эта почта зарегистрирована, на неё придёт письмо со ссылкой. Проверь и папку «Спам».',true);
  },function(err){authMsg(authErrText(err))});
}
function doSignOut(){
  var go=function(){closeModal();if(cloud.api)cloud.api.signOut().then(function(){toast('Выход из аккаунта выполнен')},function(){toast('Не получилось выйти. Попробуй ещё раз.')})};
  if(cloud.dirty||cloud.pushing){
    askConfirm({title:'Выйти без синхронизации?',text:'Последние изменения ещё не отправились в облако. Если выйти сейчас, они пропадут.',ok:'Выйти',danger:true}).then(function(ok){if(ok)go();else openAccount()});
  }else go();
}

/* ---------- actions ---------- */
function completeTask(id,li){
  if(busy[id])return;busy[id]=1;
  var finish=function(){
    delete busy[id];
    var t=findTask(id);if(!t||t.done)return;
    t.done=true;t.doneAt=now();touch(t);if(ui.editing===id)ui.editing=null;
    ui.animateTally=true;save();render();
    toast('Сделано!',{label:'Вернуть',fn:function(){var x=findTask(id);if(x){x.done=false;x.doneAt=null;touch(x);save();render()}}});
  };
  if(reduced||!li)finish();else{li.classList.add('striking');setTimeout(finish,480)}
}
function deleteTask(t){
  var idx=state.tasks.indexOf(t);if(idx<0)return;
  state.tasks.splice(idx,1);state.deleted.tasks[t.id]=now();
  if(ui.editing===t.id)ui.editing=null;
  save();render();
  toast('Задание удалено',{label:'Вернуть',fn:function(){
    if(findTask(t.id))return;
    delete state.deleted.tasks[t.id];touch(t);
    if(t.subjectId!==PERSONAL&&!findSubject(t.subjectId))t.subjectId=PERSONAL;
    state.tasks.push(t);save();render();
  }});
}

document.addEventListener('click',function(e){
  if(e.target===overlay){dismissModal();return}
  var a=e.target.closest('[data-action]');
  var menuWasOpen=false;
  if(ui.menu&&!e.target.closest('.menu')){
    var same=a&&a.dataset.action==='menu'&&a.dataset.sid===ui.menu;
    ui.menu=null;menuWasOpen=true;
    if(same||!a){render();return}
  }
  if(!a){return}
  var act=a.dataset.action,id=a.dataset.id,sid=a.dataset.sid,t=id?findTask(id):null;
  switch(act){
    case 'toggle-done':
      if(!t)break;
      if(t.done){t.done=false;t.doneAt=null;touch(t);save();render();toast('Задание снова в списке')}
      else completeTask(t.id,a.closest('.task'));
      return;
    case 'cycle-prio':
      if(!t)break;t.priority=t.priority===''?'high':t.priority==='high'?'low':'';touch(t);save();render();
      var b=board.querySelector('.prio[data-id="'+t.id+'"]');if(b)b.focus({preventScroll:true});return;
    case 'set-prio':
      if(!t)break;t.priority=t.priority===a.dataset.v?'':a.dataset.v;touch(t);save();render();
      var sb=board.querySelector('.seg-btn.'+a.dataset.v+'[data-id="'+t.id+'"]');if(sb)sb.focus({preventScroll:true});return;
    case 'edit':
      ui.editing=ui.editing===id?null:id;render();
      if(ui.editing){var ed=board.querySelector('.task[data-id="'+id+'"] .editor');if(ed&&ed.scrollIntoView)ed.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'})}
      return;
    case 'close-edit':
      var cid=ui.editing;ui.editing=null;save();render();
      var body=cid&&board.querySelector('.task-body[data-id="'+cid+'"]');if(body)body.focus({preventScroll:true});return;
    case 'clear-due':
      if(!t)break;t.due='';touch(t);save();render();return;
    case 'delete-task':
      if(t)deleteTask(t);return;
    case 'toggle-done-list':
      if(ui.openDone[sid])delete ui.openDone[sid];else ui.openDone[sid]=1;render();return;
    case 'menu':
      ui.menu=sid;render();var mi=board.querySelector('.menu button');if(mi)mi.focus();return;
    case 'rename':
      ui.menu=null;ui.renaming=sid;ui.focusSel='form[data-form="rename"][data-sid="'+sid+'"] input';render();return;
    case 'move':
      var i=state.subjects.findIndex(function(s){return s.id===sid}),j=i+Number(a.dataset.dir);
      if(i<0||j<0||j>=state.subjects.length)break;
      state.subjects.forEach(function(s,k){if(s.pos!==k){s.pos=k;touch(s)}});
      var si=state.subjects[i],sj=state.subjects[j];
      si.pos=j;sj.pos=i;touch(si);touch(sj);
      state.subjects[i]=sj;state.subjects[j]=si;
      ui.menu=null;save();render();return;
    case 'delete-subject':
      ui.menu=null;render();
      var s=findSubject(sid);if(!s)return;
      var ts=state.tasks.filter(function(x){return x.subjectId===sid}),dn=ts.filter(function(x){return x.done}).length;
      var text=ts.length?'Вместе с ней удалятся '+ts.length+' '+plural(ts.length,'задание','задания','заданий')+(dn?', из них '+dn+' '+plural(dn,'сделанное','сделанных','сделанных')+', и они пропадут из итогов семестра.':'.'):'В ней нет заданий.';
      askConfirm({title:'Удалить «'+s.name+'»?',text:text,ok:'Удалить',danger:true}).then(function(ok){
        if(!ok)return;
        var t0=now();
        state.subjects=state.subjects.filter(function(x){return x.id!==sid});
        state.deleted.subjects[sid]=t0;
        state.tasks=state.tasks.filter(function(x){if(x.subjectId===sid){state.deleted.tasks[x.id]=t0;return false}return true});
        save();render();toast('Дисциплина «'+s.name+'» удалена');
      });
      return;
    case 'add-subject-open':
      ui.addingSubject=true;ui.focusSel='#new-subject';render();return;
    case 'add-subject-cancel':
      ui.addingSubject=false;render();return;
    case 'open-stats':openStats();break;
    case 'open-backup':openBackup();break;
    case 'open-account':
      if(cloud.user)openAccount();
      else if(cloud.api)openAuth('in');
      else if(cloud.loadFailed){toast('Подключаюсь к облаку…');initCloud()}
      else toast('Облако ещё подключается, подожди пару секунд.');
      break;
    case 'auth-mode':
      var em=overlay.querySelector('[name=email]');if(em)authEmail=em.value.trim();
      openAuth(a.dataset.mode);break;
    case 'auth-reset':sendReset();break;
    case 'sync-now':if(cloud.user){cloud.dirty=true;pushNow()}break;
    case 'sign-out':doSignOut();break;
    case 'end-semester':endSemester();break;
    case 'close-modal':closeModal();break;
    case 'confirm-yes':case 'confirm-no':
      var r=confirmResolver;confirmResolver=null;closeModal();if(r)r(act==='confirm-yes');break;
    case 'download':downloadFile();break;
    case 'copy':copyCode();break;
    case 'pick-file':var fi=$('#import-file');if(fi)fi.click();break;
    case 'restore':restore();break;
  }
  if(menuWasOpen)render();
});

document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  var kind=f.dataset.form;
  if(kind==='add-task'){
    var inp=f.querySelector('input'),v=inp.value.trim();if(!v)return;
    var t0=now();
    state.tasks.push({id:uid(),subjectId:f.dataset.sid,text:v.slice(0,500),note:'',due:'',priority:'',done:false,doneAt:null,createdAt:t0,updatedAt:t0});
    inp.value='';ui.focusAdd=f.dataset.sid;save();render();
  }else if(kind==='add-subject'){
    var ni=$('#new-subject'),name=ni?ni.value.trim():'';if(!name){if(ni)ni.focus();return}
    var maxPos=state.subjects.reduce(function(m,s){return Math.max(m,s.pos)},-1);
    state.subjects.push({id:uid(),name:name.slice(0,80),pos:maxPos+1,updatedAt:now()});
    ni.value='';ui.addingSubject=true;ui.focusSel='#new-subject';save();render();
    toast('Добавлено: '+name);
  }else if(kind==='rename'){
    commitRename(f.dataset.sid,f.querySelector('input').value);
  }else if(kind==='auth'){
    submitAuth(f);
  }
});
function commitRename(sid,val){
  if(ui.renaming!==sid)return;
  var s=findSubject(sid);
  ui.renaming=null;
  if(s&&val.trim()&&val.trim()!==s.name){s.name=val.trim().slice(0,80);touch(s);save()}
  render();
}
document.addEventListener('focusout',function(e){
  var f=e.target.closest&&e.target.closest('form[data-form="rename"]');
  if(!f||e.target.tagName!=='INPUT'||(e.relatedTarget&&f.contains(e.relatedTarget)))return;
  var sid=f.dataset.sid,val=e.target.value;
  setTimeout(function(){if(document.activeElement&&f.contains(document.activeElement))return;commitRename(sid,val)},0);
});
document.addEventListener('input',function(e){
  var el=e.target,field=el.dataset&&el.dataset.field;if(!field)return;
  var t=findTask(el.dataset.id);if(!t)return;
  if(field==='text'){if(el.value.trim()){t.text=el.value.slice(0,500);touch(t);saveSoon()}}
  else if(field==='note'){t.note=el.value;touch(t);saveSoon()}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.matches&&el.matches('[data-toggle-pw]')){
    var pw=el.closest('form')&&el.closest('form').querySelector('[name=password]');if(pw)pw.type=el.checked?'text':'password';return;
  }
  if(el.id==='import-file'){
    var file=el.files&&el.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){var ta=$('#import-code');if(ta)ta.value=String(rd.result||'');toast('Файл загружен. Нажми «Восстановить».')};
    rd.onerror=function(){toast('Не получилось прочитать файл.')};
    rd.readAsText(file);return;
  }
  var field=el.dataset&&el.dataset.field;if(!field)return;
  var t=findTask(el.dataset.id);if(!t)return;
  if(field==='due'){t.due=/^\d{4}-\d{2}-\d{2}$/.test(el.value)?el.value:'';touch(t);save();render()}
  else if(field==='subject'){t.subjectId=el.value;touch(t);save();render();
    var ed=board.querySelector('.task[data-id="'+t.id+'"]');if(ed&&ed.scrollIntoView)ed.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'})}
  else if(field==='text'&&!el.value.trim()){el.value=t.text}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!overlay.hidden){dismissModal();return}
    if(ui.menu){var ms=ui.menu;ui.menu=null;render();var mb=board.querySelector('[data-action="menu"][data-sid="'+ms+'"]');if(mb)mb.focus();return}
    if(ui.renaming){ui.renaming=null;render();return}
    if(ui.editing){var id=ui.editing;ui.editing=null;save();render();var tb=board.querySelector('.task-body[data-id="'+id+'"]');if(tb)tb.focus();return}
    if(ui.addingSubject&&state.subjects.length){ui.addingSubject=false;render();return}
    return;
  }
  var el=e.target;
  if((e.key==='Enter'||e.key===' ')&&el.getAttribute&&el.getAttribute('role')==='button'&&el.dataset.action){e.preventDefault();el.click()}
});
window.addEventListener('storage',function(e){
  if(e.key!==currentKey||!e.newValue)return;
  try{var other=normalize(JSON.parse(e.newValue));var before=JSON.stringify(state);state=mergeStates(state,other);if(JSON.stringify(state)!==before)render()}catch(err){}
});
window.addEventListener('online',function(){
  if(!cloud.enabled)return;
  if(!cloud.api&&cloud.loadFailed){initCloud();return}
  if(cloud.user&&cloud.dirty)pushNow();
});
window.addEventListener('offline',function(){if(cloud.user)setStatus('offline')});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden')save();
  else if(cloud.user&&cloud.dirty&&!cloud.pushing)pushNow();
});
window.addEventListener('pagehide',function(){persistLocal()});

render();
initCloud();

if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
</body>
</html>
